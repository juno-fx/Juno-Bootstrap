apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: genesis
  namespace: {{ .Values.genesis.namespace }}
  finalizers:
    - "resources-finalizer.argocd.argoproj.io"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.genesis.namespace }}
  sources:
    - repoURL: {{ .Values.genesis.url }}
{{- if .Values.genesis.chartPath }}
      path: {{ .Values.genesis.chartPath }}
{{- else }}
      chart: {{ .Values.genesis.chart }}
{{- end }}
      targetRevision: {{ .Values.genesis.version }}
      helm:
        releaseName: genesis
        values: |-
          {{- include "omitNulls" .Values.genesis.config | nindent 10 }}
        parameters:
          - name: env.NEW_CLUSTER
            value: enabled
        {{- with .Values.genesis.config.host }}
          - name: "env.NEXTAUTH_URL"
            value: "{{ $.Values.genesis.config.http_scheme }}://{{ . }}/api/auth"
        {{- else }}
          - name: "env.AUTH_TRUST_HOST"
            value: "enabled"
        {{- end }}
          {{- if .Values.aws_marketplace.enabled }}
          - name: "env.AWS_MARKETPLACE"
            value: enabled
          - name: "env.AWS_REGION"
            value: {{ .Values.aws_region }}
          {{- end }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - CreateNamespace=true
